<!DOCTYPE html>
<html lang="ru" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Режим 1647">
  <title>1647 • TACTICAL OS</title>
  <style>
    :root[data-theme="oled"] {
      --bg: #000000; --surface: #111114; --card: #16161a; --card-auto: #12151e;
      --card-border: rgba(255, 255, 255, 0.08); --auto-border: rgba(56, 139, 253, 0.28);
      --text: #f5f5f7; --subtext: #86868b; --accent: #2997ff;
      --pill-bg: #222228; --pill-text: #d2d2d7; --cell-bg: #0d0d10; --cell-active: #1a2233;
    }
    :root[data-theme="graphite"] {
      --bg: #0e0e11; --surface: #18181c; --card: #1f1f24; --card-auto: #19202e;
      --card-border: rgba(255, 255, 255, 0.09); --auto-border: rgba(56, 139, 253, 0.32);
      --text: #f5f5f7; --subtext: #98989d; --accent: #0a84ff;
      --pill-bg: #2c2c34; --pill-text: #e5e5ea; --cell-bg: #16161a; --cell-active: #222c40;
    }
    :root[data-theme="light"] {
      --bg: #f5f5f7; --surface: #ffffff; --card: #ffffff; --card-auto: #f0f6ff;
      --card-border: rgba(0, 0, 0, 0.08); --auto-border: rgba(0, 122, 255, 0.25);
      --text: #1d1d1f; --subtext: #6e6e73; --accent: #0071e3;
      --pill-bg: #eef0f4; --pill-text: #3a3a3c; --cell-bg: #ffffff; --cell-active: #e8f2ff;
    }

    :root {
      --lab: #38bdf8; --lec: #a855f7; --prac: #f59e0b; --gym: #34d399;
      --code: #eab308; --hw: #f97316; --chores: #f43f5e; --rest: #2dd4bf;
      --social: #818cf8; --commute: #60a5fa; --danger: #ef4444; --warning: #f59e0b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }

    body {
      margin: 0; padding: env(safe-area-inset-top, 18px) 12px calc(env(safe-area-inset-bottom, 20px) + 96px);
      background-color: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      user-select: none; min-height: 100vh; max-width: 720px; margin: 0 auto;
    }

    @keyframes slideUpCascade { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes modalSpring { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes breathe { 0%, 100% { box-shadow: 0 0 4px var(--item-color, var(--accent)); } 50% { box-shadow: 0 0 16px var(--item-color, var(--accent)); } }
    @keyframes floatToken { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-38px) scale(1.35); } }

    header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 12px; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand-sub { font-size: 11px; font-weight: 600; color: var(--subtext); letter-spacing: 0.3px; }
    h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.4px; }
    .header-controls { display: flex; gap: 8px; align-items: center; }

    .token-bank {
      background: var(--surface); border: 1px solid var(--code); color: var(--code); padding: 0 12px; height: 40px;
      border-radius: 12px; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.15); transition: transform 0.15s; cursor: pointer;
    }
    .token-bank:active { transform: scale(0.92); }
    .floating-token { position: absolute; color: var(--code); font-weight: 900; font-size: 14px; animation: floatToken 0.95s forwards; pointer-events: none; z-index: 50; text-shadow: 0 0 10px var(--code); }

    .btn-icon {
      position: relative; background: var(--surface); border: 1px solid var(--card-border); color: var(--text);
      width: 40px; height: 40px; border-radius: 12px; font-size: 16px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.15s;
    }
    .btn-icon:active { transform: scale(0.85); }
    .badge-count {
      position: absolute; top: -4px; right: -4px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800;
      min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; display: flex; align-items: center; justify-content: center;
    }

    .live-hud { background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; transition: all 0.35s ease; }
    .hud-warning { border-color: var(--warning); box-shadow: 0 0 20px rgba(245, 158, 11, 0.15); }
    .hud-weather { border-color: var(--lab); box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }
    .hud-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .hud-status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }
    .hud-warning .hud-status { color: var(--warning); }
    .hud-weather .hud-status { color: var(--lab); }
    .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .hud-warning .pulse-dot { background: var(--warning); }
    .hud-weather .pulse-dot { background: var(--lab); }
    .hud-clock { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--subtext); }
    .hud-main { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.25; }
    .hud-bar-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .hud-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }

    .week-nav { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--card-border); border-radius: 15px; padding: 5px; margin-bottom: 12px; }
    .nav-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text); width: 40px; height: 38px; border-radius: 11px; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    .nav-btn:active { transform: scale(0.88); }
    .week-title { text-align: center; flex: 1; }
    #week-label { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    #week-dates { font-size: 11px; font-weight: 600; color: var(--subtext); }

    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; text-align: center; font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
    .cal-cell { background: var(--cell-bg); border: 1px solid var(--card-border); border-radius: 12px; min-height: 82px; padding: 6px 3px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; position: relative; transition: transform 0.15s, border-color 0.15s, background 0.15s; }
    .cal-cell:active { transform: scale(0.93); }
    .cal-cell.active { background: var(--cell-active); border: 1.5px solid var(--accent); }
    .cal-cell.today::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .cell-day-num { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 1px; }
    .shift-bars { display: flex; flex-direction: column; gap: 3px; width: 100%; align-items: center; }
    .shift-bar { width: 90%; font-size: 9px; font-weight: 800; padding: 3px 0; border-radius: 5px; text-align: center; color: #0b0b0e; }

    .summary-banner { background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; margin-bottom: 14px; }
    .summary-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--subtext); font-weight: 700; margin-bottom: 10px; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 11px; padding: 8px 10px; }
    .stat-label { font-size: 11px; color: var(--subtext); margin-bottom: 2px; font-weight: 500; }
    .stat-val { font-size: 14px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

    .timeline { display: flex; flex-direction: column; gap: 10px; }
    .item-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 13px 12px 13px 14px; display: grid; grid-template-columns: 56px 1fr auto; gap: 11px; align-items: center; position: relative; animation: slideUpCascade 0.35s ease both; }
    .item-card::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3.5px; border-radius: 0 4px 4px 0; background: var(--item-color, var(--accent)); }
    .item-card.auto-card { background: var(--card-auto); border: 1px dashed var(--auto-border); }
    .item-card.live-now { border-color: var(--item-color, var(--accent)); animation: breathe 3s infinite ease-in-out; }
    .item-card.done { opacity: 0.65; border-color: transparent; }
    .item-card.done .title { text-decoration: line-through; color: var(--subtext); }

    .time-col { display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--card-border); padding-right: 10px; font-variant-numeric: tabular-nums; cursor: pointer; }
    .time-start { font-size: 14px; font-weight: 800; }
    .time-end { font-size: 11.5px; color: var(--subtext); margin-top: 2px; font-weight: 600; }
    .dur-tag { font-size: 9px; color: var(--subtext); background: var(--pill-bg); padding: 2px 5px; border-radius: 4px; margin-top: 4px; font-weight: 600; }
    .badge-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; cursor: pointer; }
    .badge { font-size: 10.5px; font-weight: 700; }
    .live-pill { background: var(--item-color, var(--accent)); color: #000; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
    .title { font-size: 15px; font-weight: 700; margin-bottom: 5px; line-height: 1.25; cursor: pointer; transition: color 0.2s; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--subtext); align-items: center; cursor: pointer; }
    .pill { background: var(--pill-bg); padding: 3px 8px; border-radius: 6px; color: var(--pill-text); font-size: 11px; font-weight: 600; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .icon-btn { background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--text); width: 32px; height: 32px; border-radius: 9px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease, background 0.2s ease; }
    .icon-btn:active { transform: scale(0.75); }
    .icon-btn.check.checked { background: var(--gym); color: #000; border-color: var(--gym); }
    .icon-btn.del { color: var(--danger); }

    .empty-state { background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 34px 18px; text-align: center; color: var(--subtext); font-size: 14px; font-weight: 600; }

    .fab-bar { position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 10px); left: 12px; right: 12px; max-width: 696px; margin: 0 auto; display: flex; gap: 8px; z-index: 30; background: rgba(18, 18, 22, 0.88); backdrop-filter: blur(20px); padding: 8px; border-radius: 18px; border: 1px solid var(--card-border); }
    .btn-main { flex: 1.5; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .btn-main:active { transform: scale(0.97); }
    .btn-secondary { flex: 1; background: var(--pill-bg); color: var(--text); border: 1px solid var(--card-border); padding: 14px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
    .btn-secondary:active { transform: scale(0.97); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border-top: 1px solid var(--card-border); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom, 20px) + 18px); display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; animation: modalSpring 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.08) forwards; }
    .modal h2 { margin: 0; font-size: 18px; font-weight: 800; }
    
    .row { display: flex; gap: 12px; align-items: flex-start; }
    .settings-group { margin-bottom: 16px; }
    .field-label { font-size: 11px; color: var(--subtext); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; display: block; }
    
    input, select { width: 100%; background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 13px; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
    input:focus, select:focus { border-color: var(--accent); }

    .quick-chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0; }
    .chip { background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip:active { background: var(--accent); color: #fff; }

    .dur-presets { display: flex; gap: 6px; }
    .dur-btn { flex: 1; background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--pill-text); padding: 7px 0; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .dur-btn:active { background: var(--accent); color: #fff; }

    .todo-list { display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; }
    .todo-item { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .todo-item.done { opacity: 0.45; text-decoration: line-through; }
    .todo-text { font-size: 14px; font-weight: 600; flex: 1; cursor: pointer; }
    .todo-subj { font-size: 11px; color: var(--accent); font-weight: 700; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-sub">ГУАП • ГРУППА 1647</span>
      <h1>Мой Режим</h1>
    </div>
    <div class="header-controls">
      <div class="token-bank" title="Баланс токенов дофамина">⚡ <span id="token-count" style="margin-left:4px;">0</span></div>
      <button class="btn-icon" onclick="openDeadlines()" title="Дедлайны и хвосты">📌<span class="badge-count" id="dl-badge" style="display:none">0</span></button>
      <button class="btn-icon" onclick="resetToToday()" title="Сегодня">📅</button>
      <button class="btn-icon" onclick="openSettings()" title="Настройки">⚙️</button>
    </div>
  </header>

  <div class="live-hud" id="live-hud">
    <div class="hud-top">
      <div class="hud-status"><span class="pulse-dot"></span><span id="hud-tag">СТАТУС ДНЯ</span></div>
      <div class="hud-clock" id="hud-clock">--:--</div>
    </div>
    <div class="hud-main" id="hud-main">Загрузка...</div>
    <div class="hud-bar-wrap"><div class="hud-bar-fill" id="hud-bar" style="width: 0%"></div></div>
  </div>

  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
    <div class="week-title"><div id="week-label">🔵 Четная неделя</div><div id="week-dates">...</div></div>
    <button class="nav-btn" onclick="changeWeek(1)">›</button>
  </div>

  <div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
  <div class="cal-grid" id="cal-grid"></div>

  <div id="summary-container"></div>
  <div class="timeline" id="timeline"></div>

  <div class="fab-bar">
    <button class="btn-main" onclick="openModal()">+ Добавить блок</button>
    <button class="btn-secondary" id="toggle-auto-btn" onclick="toggleAutoCommute()">⚡ Авто: ВКЛ</button>
  </div>

  <!-- Модалка блока -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="modal-title">Новый блок</h2>
        <button class="dur-btn" id="dup-week-btn" style="display:none; padding:6px 10px; flex:unset;" onclick="duplicateToOtherWeek()">⇄ На др. неделю</button>
      </div>

      <div class="quick-chips">
        <span class="chip" onclick="fillTemplate('Тренировка в зале', 'gym', 'Спортзал', 'Силовая')">💪 Зал (+3⚡)</span>
        <span class="chip" onclick="fillTemplate('Саморазвитие', 'code', 'Дом', 'Фокус')">🧠 Саморазвитие (+3⚡)</span>
        <span class="chip" onclick="fillTemplate('Лабы / ДЗ', 'hw', 'Дом', 'Учеба')">📝 Лабы (+3⚡)</span>
        <span class="chip" onclick="fillTemplate('Уборка / Готовка', 'chores', 'Дом', 'Быт')">🧹 Быт (0⚡)</span>
        <span class="chip" onclick="fillTemplate('Отдых / CS2 / Dota 2', 'rest', 'Дом', 'Чилл')">🎮 Отдых (-3⚡)</span>
        <!-- ВОЗВРАЩЕННЫЙ ЧИП ПРОГУЛОК -->
        <span class="chip" onclick="fillTemplate('Встреча с друзьями / Прогулка', 'social', 'Город', 'Прогулка')">🚶 Прогулки (0⚡)</span>
      </div>

      <input type="text" id="inp-title" placeholder="Название (например: Тренировка в зале)">

      <!-- ИСПРАВЛЕННЫЕ ИНПУТЫ ВРЕМЕНИ -->
      <div class="row" style="align-items: center;">
        <input type="time" id="inp-start" value="10:00" style="flex:1; min-width:0;">
        <input type="time" id="inp-end" value="12:30" style="flex:1; min-width:0;">
      </div>

      <div class="dur-presets">
        <button class="dur-btn" onclick="setDuration(45)">45м</button>
        <button class="dur-btn" onclick="setDuration(60)">1ч</button>
        <button class="dur-btn" onclick="setDuration(90)">1.5ч</button>
        <button class="dur-btn" onclick="setDuration(120)">2ч</button>
        <button class="dur-btn" onclick="shiftBlock(30)">Сдвиг +30м</button>
      </div>

      <div class="row" style="align-items: center;">
        <select id="inp-type" style="flex:1.2; min-width:0;">
          <option value="gym">💪 Тренировка в зале (+3 ⚡)</option>
          <option value="code">🧠 Саморазвитие (+3 ⚡)</option>
          <option value="hw">📝 Лабы / ДЗ (+3 ⚡)</option>
          <option value="chores">🧹 Домашние дела / Быт (0 ⚡)</option>
          <option value="rest">🎮 Отдых / CS2 (-3 ⚡)</option>
          <option value="social">🚶 Встречи / Прогулки (0 ⚡)</option>
          <option value="commute">🚇 Режим / Обед</option>
          <option value="prac">🟠 Практика (Вуз)</option>
          <option value="lab">🔵 Лабораторная (Вуз)</option>
          <option value="lec">🟣 Лекция (Вуз)</option>
        </select>
        <input type="text" id="inp-loc" placeholder="Место (Дом/Зал)" style="flex:1; min-width:0;">
      </div>

      <input type="text" id="inp-note" placeholder="Заметка или преподаватель">

      <div class="row" style="margin-top:4px; align-items: stretch;">
        <button class="btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn-main" onclick="saveItem()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка дедлайнов -->
  <div class="modal-backdrop" id="deadlines-modal">
    <div class="modal">
      <h2>📌 Дедлайны и хвосты</h2>
      <div class="row" style="align-items: center;">
        <select id="dl-subj" style="flex:0.9; min-width:0;">
          <option value="Информатика">Информатика</option>
          <option value="ОЦГ">ОЦГ</option>
          <option value="Физика">Физика</option>
          <option value="Вышмат">Вышмат</option>
          <option value="История / ОРГ">История / ОРГ</option>
          <option value="БЖД">БЖД</option>
          <option value="Личное">Личное</option>
        </select>
        <input type="text" id="dl-text" placeholder="Что нужно сделать..." style="flex:1.5; min-width:0;">
      </div>
      <button class="btn-main" style="padding:12px;" onclick="addDeadline()">+ Добавить</button>
      <div class="todo-list" id="todo-list"></div>
      <button class="btn-secondary" onclick="closeDeadlines()">Закрыть</button>
    </div>
  </div>

  <!-- Модалка настроек -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal">
      <h2>⚙️ Настройки</h2>

      <div class="settings-group">
        <label class="field-label">Оформление</label>
        <select id="set-theme" onchange="previewTheme(this.value)">
          <option value="oled">🌑 OLED Чёрная (Строгая)</option>
          <option value="graphite">🪨 Графитовая iOS Pro</option>

  </div>

<script>
  const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const SEMESTER_START = new Date(2026, 8, 1);

  let weekOffset = 0;
  let currentWeekParity = 'even';
  let currentDay = (new Date().getDay() + 6) % 7;
  let editingId = null;
  let notifiedBlocks = {};
  let weatherDelay = 0;
  let weatherAlertMsg = "";

  const TYPE_LABELS = {
    lab:     { text: 'Лабораторная работа', hex: '#38bdf8' },
    lec:     { text: 'Лекция', hex: '#a855f7' },
    prac:    { text: 'Практическая работа', hex: '#f59e0b' },
    gym:     { text: 'Спорт / Тренировка', hex: '#34d399' },
    code:    { text: 'Саморазвитие', hex: '#eab308' },
    hw:      { text: 'Лабы / ДЗ', hex: '#f97316' },
    chores:  { text: 'Домашние дела', hex: '#f43f5e' },
    rest:    { text: 'Отдых / Игры', hex: '#2dd4bf' },
    social:  { text: 'Встречи / Прогулки', hex: '#818cf8' },
    commute: { text: 'Маршрут / Режим (Авто)', hex: '#60a5fa' }
  };

  const DEFAULT_SETTINGS = {
    theme: 'oled', homeAddress: 'Дом', timeBM: 90, timeGastLen: 120, prepTime: 50,
    transitBMLen: 45, gymPrep: 20, gymWalk: 15, showAutoBlocks: true, notifications: false, tokens: 0
  };

  const DEFAULT_DATA = {
    even: {
      0: [],
      1: [{ id: 'e1_1', start: '11:10', end: '12:40', type: 'lab', title: 'Основы цифровой грамотности', loc: 'Б.М. 12-29' }, { id: 'e1_2', start: '15:10', end: '16:40', type: 'lec', title: 'Физика', loc: 'Лен. 32-13' }],
      2: [{ id: 'e2_1', start: '09:30', end: '11:00', type: 'prac', title: 'Математика. Аналитическая геометрия', loc: 'Гаст. 24-02' }, { id: 'e2_2', start: '11:10', end: '12:40', type: 'prac', title: 'История', loc: 'Гаст. 12-04' }, { id: 'e2_3', start: '13:00', end: '14:30', type: 'prac', title: 'Математика. Математический анализ', loc: 'Гаст. 24-02' }, { id: 'e2_4', start: '15:10', end: '16:40', type: 'prac', title: 'Основы российской государственности', loc: 'Лен. 23-01' }],
      3: [{ id: 'e3_1', start: '13:00', end: '14:30', type: 'lec', title: 'Математика. Аналитическая геометрия', loc: 'Гаст. 12-01' }, { id: 'e3_2', start: '15:10', end: '16:40', type: 'lec', title: 'Математика. Математический анализ', loc: 'Гаст. 12-01' }, { id: 'e3_3', start: '17:00', end: '18:30', type: 'lab', title: 'Информатика', loc: 'Гаст. 33-09' }],
      4: [{ id: 'e4_1', start: '11:10', end: '12:40', type: 'lec', title: 'История', loc: 'Лен. 33-07' }, { id: 'e4_2', start: '13:00', end: '14:30', type: 'lec', title: 'История', loc: 'Лен. 33-07' }, { id: 'e4_3', start: '15:10', end: '16:40', type: 'lec', title: 'История', loc: 'Лен. 33-07' }],
      5: [{ id: 'e5_1', start: '09:30', end: '11:00', type: 'prac', title: 'Физическая культура', loc: 'Лен. спортзал' }, { id: 'e5_2', start: '11:10', end: '12:40', type: 'lec', title: 'Физическая культура', loc: 'Лен. 32-13' }],
      6: []
    },
    odd: {
      0: [{ id: 'o0_1', start: '17:00', end: '18:30', type: 'lab', title: 'Безопасность жизнедеятельности', loc: 'Б.М. 14-05' }, { id: 'o0_2', start: '18:40', end: '20:10', type: 'lec', title: 'Безопасность жизнедеятельности', loc: 'Б.М. 53-07' }],
      1: [{ id: 'o1_1', start: '11:10', end: '12:40', type: 'lab', title: 'Основы цифровой грамотности', loc: 'Б.М. 12-29' }, { id: 'o1_2', start: '15:10', end: '16:40', type: 'lec', title: 'Физика', loc: 'Лен. 32-13' }],
      2: [{ id: 'o2_1', start: '09:30', end: '11:00', type: 'prac', title: 'Математика. Аналитическая геометрия', loc: 'Гаст. 24-02' }, { id: 'o2_2', start: '13:00', end: '14:30', type: 'prac', title: 'Математика. Математический анализ', loc: 'Гаст. 24-02' }, { id: 'o2_3', start: '15:10', end: '16:40', type: 'prac', title: 'Основы российской государственности', loc: 'Лен. 23-01' }],
      3: [{ id: 'o3_1', start: '13:00', end: '14:30', type: 'lec', title: 'Математика. Аналитическая геометрия', loc: 'Гаст. 12-01' }, { id: 'o3_2', start: '15:10', end: '16:40', type: 'lec', title: 'Математика. Математический анализ', loc: 'Гаст. 12-01' }, { id: 'o3_3', start: '17:00', end: '18:30', type: 'lab', title: 'Информатика', loc: 'Гаст. 33-09' }, { id: 'o3_4', start: '18:40', end: '20:10', type: 'lab', title: 'Физика', loc: 'Гаст. 32-04' }],
      4: [{ id: 'o4_1', start: '11:10', end: '12:40', type: 'prac', title: 'Иностранный язык', loc: 'Гаст. 34-06' }, { id: 'o4_2', start: '13:00', end: '14:30', type: 'prac', title: 'Иностранный язык', loc: 'Гаст. 34-04' }, { id: 'o4_3', start: '15:10', end: '16:40', type: 'lec', title: 'Информатика', loc: 'Лен. 32-13' }],
      5: [], 6: []
    }
  };

  let state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  let settings = Object.assign({}, DEFAULT_SETTINGS);
  let deadlines = [];

  // ЗАГРУЗКА ИЗ ПАМЯТИ ПО КЛЮЧАМ V5
  try {
    const savedState = JSON.parse(localStorage.getItem('schedule_1647_v5') || localStorage.getItem('schedule_1647_v4'));
    if (savedState && savedState.even && savedState.odd) state = savedState;
  } catch (e) {}

  try {
    const savedSettings = JSON.parse(localStorage.getItem('settings_1647_v5'));
    if (savedSettings) settings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);
    if (!settings.homeAddress || settings.homeAddress.includes('Арцеуловская')) settings.homeAddress = 'Дом';
    if (typeof settings.tokens !== 'number' || isNaN(settings.tokens)) settings.tokens = 0;
    if (!['oled', 'graphite', 'light'].includes(settings.theme)) settings.theme = 'oled';
  } catch (e) {}

  try {
    const savedDeadlines = JSON.parse(localStorage.getItem('deadlines_1647_v1'));
    if (Array.isArray(savedDeadlines)) deadlines = savedDeadlines;
  } catch (e) {}

  function saveAllStorage() {
    localStorage.setItem('schedule_1647_v5', JSON.stringify(state));
    localStorage.setItem('settings_1647_v5', JSON.stringify(settings));
    localStorage.setItem('deadlines_1647_v1', JSON.stringify(deadlines));
  }

  function updateTokensUI() {
    const el = document.getElementById('token-count');
    if (el) el.innerText = settings.tokens || 0;
  }

  function renderDeadlinesBadge() {
    const badge = document.getElementById('dl-badge');
    if (!badge) return;
    const pending = deadlines.filter(d => !d.done).length;
    if (pending > 0) { badge.style.display = 'flex'; badge.innerText = pending; }
    else { badge.style.display = 'none'; }
  }

  async function fetchWeather() {
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=59.9386&longitude=30.3141&current_weather=true');
      const data = await res.json();
      if (data && data.current_weather) {
        const code = data.current_weather.weathercode;
        const temp = data.current_weather.temperature;
        if ([51,53,55,61,63,65,66,67,71,73,75,77,80,81,82,85,86].includes(code)) { weatherDelay = 10; weatherAlertMsg = "🌧 Слякоть: +10 мин к дороге"; } 
        else if (temp < -5) { weatherDelay = 10; weatherAlertMsg = "❄️ Мороз: +10 мин к сборам"; }
        renderAll();
      }
    } catch (e) {}
  }

  function getMondayOfWeek(offset = 0) { const now = new Date(); now.setHours(0, 0, 0, 0); const day = (now.getDay() + 6) % 7; return new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + (offset * 7)); }
  function isEvenWeek(date) { const day = (date.getDay() + 6) % 7; const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - day); const sDay = (SEMESTER_START.getDay() + 6) % 7; const sMonday = new Date(SEMESTER_START.getFullYear(), SEMESTER_START.getMonth(), SEMESTER_START.getDate() - sDay); return (Math.round((monday.getTime() - sMonday.getTime()) / (7 * 24 * 60 * 60 * 1000)) % 2 !== 0); }
  function generateWeekDays(offset) { const monday = getMondayOfWeek(offset); const daysArr = []; for (let i = 0; i < 7; i++) { const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i); daysArr.push({ raw: d, num: d.getDate(), month: MONTHS[d.getMonth()] }); } return daysArr; }
  function changeWeek(dir) { weekOffset += dir; currentDay = dir > 0 ? 0 : 6; renderAll(); }
  function resetToToday() { weekOffset = 0; currentDay = (new Date().getDay() + 6) % 7; renderAll(); }
  function toMins(t) { if (!t || typeof t !== 'string' || !t.includes(':')) return 0; const [h, m] = t.split(':').map(Number); return (h || 0) * 60 + (m || 0); }
  function fromMins(m) { const cl = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(cl / 60)).padStart(2, '0')}:${String(cl % 60).padStart(2, '0')}`; }
  function formatDuration(start, end) { const diff = toMins(end) - toMins(start); if (diff <= 0) return ''; const h = Math.floor(diff / 60); const m = diff % 60; return h > 0 ? (m > 0 ? `${h}ч ${m}м` : `${h}ч`) : `${m}м`; }
  function getCampus(loc = '') { const l = (loc || '').toLowerCase(); if (l.includes('б.м') || l.includes('большая морская')) return 'BM'; if (l.includes('гаст')) return 'GAST'; if (l.includes('лен')) return 'LEN'; return null; }
  function getTravelMinutes(campus) { if (campus === 'BM') return Number(settings.timeBM) || 90; if (campus === 'GAST' || campus === 'LEN') return Number(settings.timeGastLen) || 120; return 0; }
  function isLocalGym(item) { return item && getCampus(item.loc) === null && item.type === 'gym'; }

  function buildAutoLogistics(dayItems, includeWeather = true) {
    if (!dayItems || dayItems.length === 0) return { summary: null, autoBlocks: [] };
    const sorted = [...dayItems].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    const firstItem = sorted[0];
    const uniClasses = sorted.filter(x => getCampus(x.loc) !== null);
    const gymSessions = sorted.filter(x => isLocalGym(x));

    const wDelay = (includeWeather && weatherDelay > 0) ? weatherDelay : 0;
    const prepUni = (Number(settings.prepTime) || 50) + wDelay;
    const gymPrep = (Number(settings.gymPrep) || 20) + wDelay;
    const gymWalk = Number(settings.gymWalk) || 15;

    const autoBlocks = [];
    let wakeM = null, firstLeaveText = 'Дома', homeTimeText = '—';

    if (isLocalGym(firstItem)) {
      const leaveForGym = toMins(firstItem.start) - gymWalk; wakeM = leaveForGym - gymPrep; firstLeaveText = `${fromMins(leaveForGym)} (в зал)`;
    } else if (getCampus(firstItem.loc) !== null) {
      const c = getCampus(firstItem.loc); const leaveM = toMins(firstItem.start) - getTravelMinutes(c); wakeM = leaveM - prepUni;
      firstLeaveText = (c === 'GAST' || c === 'LEN') ? `${fromMins(toMins(firstItem.start) - 120)}–${fromMins(toMins(firstItem.start) - 90)}` : fromMins(leaveM);
    } else {
      wakeM = toMins(firstItem.start) - 30; if (settings.showAutoBlocks) autoBlocks.push({ id: 'a_w', isAuto: true, start: fromMins(wakeM), end: firstItem.start, type: 'commute', title: '⏰ Подъем и завтрак', loc: settings.homeAddress });
    }

    gymSessions.forEach((g, idx) => {
      const leaveGymM = toMins(g.start) - gymWalk; const prepGymM = leaveGymM - gymPrep; const backHomeM = toMins(g.end) + gymWalk;
      if (settings.showAutoBlocks) {
        autoBlocks.push({ id: 'g_p_' + idx, isAuto: true, start: fromMins(prepGymM), end: fromMins(leaveGymM), type: 'commute', title: g.id === firstItem.id ? '⏰ Подъем и сборы в зал' : '🎒 Сборы в зал', loc: settings.homeAddress });
        autoBlocks.push({ id: 'g_to_' + idx, isAuto: true, start: fromMins(leaveGymM), end: g.start, type: 'commute', title: '🚶 Дорога в зал', loc: `Пешком ${gymWalk} мин` });
        autoBlocks.push({ id: 'g_b_' + idx, isAuto: true, start: g.end, end: fromMins(backHomeM), type: 'commute', title: '🚶 Дорога из зала домой', loc: `Пешком ${gymWalk} мин` });
        if (uniClasses.length > 0) {
          const leaveUniM = toMins(uniClasses[0].start) - getTravelMinutes(getCampus(uniClasses[0].loc));
          if (leaveUniM > backHomeM && leaveUniM - backHomeM <= 300) autoBlocks.push({ id: 'h_ref_' + idx, isAuto: true, start: fromMins(backHomeM), end: fromMins(leaveUniM), type: 'commute', title: '🚿 Дома: душ и обед перед вузом', loc: settings.homeAddress });
        }
      }
      homeTimeText = fromMins(backHomeM);
    });

    if (uniClasses.length > 0) {
      const fU = uniClasses[0], lU = uniClasses[uniClasses.length - 1];
      const leaveUniM = toMins(fU.start) - getTravelMinutes(getCampus(fU.loc)); const arrHomeM = toMins(lU.end) + getTravelMinutes(getCampus(lU.loc));
      if (settings.showAutoBlocks) {
        if (fU.id === firstItem.id) autoBlocks.push({ id: 'u_w', isAuto: true, start: fromMins(leaveUniM - prepUni), end: fromMins(leaveUniM), type: 'commute', title: '⏰ Подъем и сборы', loc: settings.homeAddress });
        autoBlocks.push({ id: 'u_l', isAuto: true, start: fromMins(leaveUniM), end: fU.start, type: 'commute', title: `🚇 Выезд в вуз (${(fU.loc || '').split(' ')[0]})`, loc: `${settings.homeAddress} → ${fU.loc}` });
        for (let i = 0; i < uniClasses.length - 1; i++) {
          const c1 = getCampus(uniClasses[i].loc), c2 = getCampus(uniClasses[i + 1].loc);
          if (c1 && c2 && c1 !== c2) {
            const trStart = toMins(uniClasses[i].end); const trMins = (c1 !== 'BM' && c2 !== 'BM') ? 15 : (Number(settings.transitBMLen) || 45);
            autoBlocks.push({ id: 'u_tr_' + i, isAuto: true, start: uniClasses[i].end, end: fromMins(Math.min(toMins(uniClasses[i + 1].start), trStart + trMins)), type: 'commute', title: trMins === 15 ? '🚶 Переход между корпусами' : '🚇 Переезд + обед', loc: `${(uniClasses[i].loc || '').split(' ')[0]} → ${(uniClasses[i + 1].loc || '').split(' ')[0]}` });
          }
        }
        autoBlocks.push({ id: 'u_h', isAuto: true, start: lU.end, end: fromMins(arrHomeM), type: 'commute', title: '🏠 Дорога домой', loc: `${(lU.loc || '').split(' ')[0]} → ${settings.homeAddress}` });
      }
      if (gymSessions.length === 0 || toMins(lU.end) > toMins(gymSessions[gymSessions.length - 1].end)) homeTimeText = `~${fromMins(arrHomeM)}`;
    }

    const sleepM = wakeM !== null ? wakeM - 480 : null;
    return { summary: { wakeTime: wakeM !== null ? fromMins(wakeM) : 'Свободный', sleepTime: sleepM !== null ? fromMins(sleepM) : '—', firstLeave: firstLeaveText, homeTime: homeTimeText }, autoBlocks };
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', settings.theme || 'oled');
    const btn = document.getElementById('toggle-auto-btn');
    if (btn) { btn.style.opacity = settings.showAutoBlocks ? '1' : '0.55'; btn.innerText = settings.showAutoBlocks ? '⚡ Авто: ВКЛ' : '⚡ Авто: ВЫКЛ'; }
  }
  function previewTheme(val) { document.documentElement.setAttribute('data-theme', val); }
  function toggleAutoCommute() { settings.showAutoBlocks = !settings.showAutoBlocks; saveAllStorage(); applyTheme(); renderAll(); }

  function getBarGradient(hr) {
    if (hr < 12) return 'linear-gradient(90deg, #34d399, #38bdf8)';
    if (hr < 18) return 'linear-gradient(90deg, #38bdf8, #a855f7)';
    return 'linear-gradient(90deg, #a855f7, #ef4444)';
  }

  function updateLiveRadar() {
    try {
      if (settings.notifications) checkNotifications();
      const now = new Date(); const hr = now.getHours(); const mm = now.getMinutes();
      const clockEl = document.getElementById('hud-clock'); if (clockEl) clockEl.innerText = `${String(hr).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
      const nowMins = hr * 60 + mm;

      const baseList = (state[currentWeekParity] && state[currentWeekParity][currentDay]) ? state[currentWeekParity][currentDay] : [];
      const logic = buildAutoLogistics(baseList);
      const combined = [...baseList, ...logic.autoBlocks].sort((a, b) => (a.start || '').localeCompare(b.start || ''));

      const hud = document.getElementById('live-hud'); const hudTag = document.getElementById('hud-tag'); const hudMain = document.getElementById('hud-main'); const hudBar = document.getElementById('hud-bar');
      if (!hud || !hudTag || !hudMain || !hudBar) return;

      hudBar.style.background = getBarGradient(hr); hud.className = 'live-hud';
      const isTodaySelected = (weekOffset === 0 && currentDay === (now.getDay() + 6) % 7);

      if (!isTodaySelected) {
        const doneCount = baseList.filter(x => x.done).length; const pct = baseList.length ? Math.round((doneCount / baseList.length) * 100) : 0;
        hudTag.innerText = `ПРОГРЕСС ДНЯ • ${pct}%`; hudMain.innerText = baseList.length ? `Запланировано блоков: ${baseList.length}` : 'Свободный день'; hudBar.style.width = `${pct}%`;
        if (weatherAlertMsg) { hud.classList.add('hud-weather'); hudMain.innerText = weatherAlertMsg; }
        return;
      }

      const active = combined.find(it => nowMins >= toMins(it.start) && nowMins < toMins(it.end));
      const next = combined.find(it => toMins(it.start) > nowMins);

      const tomParity = (currentDay === 6) ? (currentWeekParity === 'even' ? 'odd' : 'even') : currentWeekParity;
      const tomItems = (state[tomParity] && state[tomParity][(currentDay + 1) % 7]) ? state[tomParity][(currentDay + 1) % 7] : [];
      const tomLogic = buildAutoLogistics(tomItems, false);
      const tomWakeM = (tomLogic.summary && tomLogic.summary.wakeTime !== 'Свободный') ? toMins(tomLogic.summary.wakeTime) : 600;
      let sleepMinsToday = tomWakeM - 480; if (sleepMinsToday < 0) sleepMinsToday += 1440;

      let isSleepWarning = false;
      if (active && active.type === 'rest') {
        let minsToSleep = sleepMinsToday - nowMins; if (minsToSleep < 0) minsToSleep += 1440;
        if (minsToSleep <= 55 && minsToSleep > 0) {
          isSleepWarning = true; hud.classList.add('hud-warning'); hudTag.innerText = `ДО ОТБОЯ ${minsToSleep} МИН`; hudMain.innerText = "⚠️ Времени только на быструю в CS2. Доту не запускай — сорвешь режим!";
        }
      }

      if (active) {
        const total = Math.max(1, toMins(active.end) - toMins(active.start)); const passed = nowMins - toMins(active.start); const pct = Math.min(100, Math.round((passed / total) * 100));
        const left = toMins(active.end) - nowMins; const hLeft = Math.floor(left / 60); const mLeft = left % 60;
        const leftStr = hLeft > 0 ? (mLeft > 0 ? `${hLeft}Ч ${mLeft}М` : `${hLeft}Ч`) : `${mLeft} МИН`;

        if (!isSleepWarning) {
          if (weatherAlertMsg && active.type === 'commute') { hud.classList.add('hud-weather'); hudTag.innerText = `СЕЙЧАС ИДЕТ • ОСТАЛОСЬ ${leftStr}`; hudMain.innerText = weatherAlertMsg; }
          else { hudTag.innerText = `СЕЙЧАС ИДЕТ • ОСТАЛОСЬ ${leftStr}`; hudMain.innerText = active.title; }
        }
        hudBar.style.width = `${pct}%`;
      } else if (next) {
        const diff = toMins(next.start) - nowMins; const h = Math.floor(diff / 60); const m = diff % 60;
        const leftStr = h > 0 ? (m > 0 ? `${h}Ч ${m}М` : `${h}Ч`) : `${m} МИН`;
        hudTag.innerText = `ДАЛЕЕ ЧЕРЕЗ ${leftStr}`; hudMain.innerText = `${next.start} — ${next.title}`; hudBar.style.width = `12%`;
        if (weatherAlertMsg && next.type === 'commute' && diff < 60) { hud.classList.add('hud-weather'); hudMain.innerText = weatherAlertMsg; }
      } else { hudTag.innerText = `ДЕНЬ ЗАВЕРШЕН`; hudMain.innerText = `Все дела на сегодня выполнены`; hudBar.style.width = `100%`; }
    } catch (e) {}
  }

  function enablePush() {
    if (!('Notification' in window)) { alert('Уведомления не поддерживаются.'); return; }
    Notification.requestPermission().then(p => { if (p === 'granted') { settings.notifications = true; saveAllStorage(); alert('Пуши включены!'); } });
  }

  function checkNotifications() {
    try {
      if (!settings.notifications || !('Notification' in window) || Notification.permission !== 'granted') return;
      const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const uidPref = new Date().toDateString() + '_';
      const baseList = (state[currentWeekParity] && state[currentWeekParity][currentDay]) ? state[currentWeekParity][currentDay] : [];
      const c = [...baseList, ...buildAutoLogistics(baseList).autoBlocks];
      c.forEach(item => {
        if (toMins(item.start) - nowMins === 15) {
          const id = uidPref + item.id;
          if (!notifiedBlocks[id]) { new Notification("Скоро: " + item.title, { body: `В ${item.start} • ${item.loc || ''}` }); notifiedBlocks[id] = true; }
        }
      });
    } catch (e) {}
  }

  function renderAll() {
    try {
      updateTokensUI(); renderDeadlinesBadge();
      const datesArr = generateWeekDays(weekOffset); currentWeekParity = isEvenWeek(datesArr[0].raw) ? 'even' : 'odd';
      
      const weekLabelEl = document.getElementById('week-label'); const weekDatesEl = document.getElementById('week-dates');
      if (weekLabelEl) weekLabelEl.innerText = currentWeekParity === 'even' ? '🔵 Четная неделя' : '🔴 Нечетная неделя';
      if (weekDatesEl) weekDatesEl.innerText = `${datesArr[0].num} ${datesArr[0].month} — ${datesArr[6].num} ${datesArr[6].month}`;

      const todayDate = new Date(); todayDate.setHours(0, 0, 0, 0); const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const isTodaySelected = (weekOffset === 0 && currentDay === (new Date().getDay() + 6) % 7);

      const calGrid = document.getElementById('cal-grid');
      if (calGrid) {
        calGrid.innerHTML = DAYS.map((dName, i) => {
          const dayArr = (state[currentWeekParity] && state[currentWeekParity][i]) ? state[currentWeekParity][i] : [];
          const items = [...dayArr].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
          const bars = items.slice(0, 3).map(it => { const tInfo = TYPE_LABELS[it.type] || TYPE_LABELS.code; return `<div class="shift-bar" style="background:${tInfo.hex}">${it.start}</div>`; }).join('');
          return `<div class="cal-cell ${i === currentDay ? 'active' : ''} ${datesArr[i].raw.getTime() === todayDate.getTime() ? 'today' : ''}" onclick="selectDay(${i})"><div class="cell-day-num">${datesArr[i].num}</div><div class="shift-bars">${bars}</div></div>`;
        }).join('');
      }

      const baseList = (state[currentWeekParity] && state[currentWeekParity][currentDay]) ? state[currentWeekParity][currentDay] : [];
      const { summary, autoBlocks } = buildAutoLogistics(baseList);

      const summaryContainer = document.getElementById('summary-container');
      if (summaryContainer) {
        if (summary && baseList.length > 0) {
          summaryContainer.innerHTML = `<div class="summary-banner"><div class="summary-header"><span>📍 ${settings.homeAddress}</span><span>💤 Отбой (8ч сна): ${summary.sleepTime}</span></div><div class="summary-grid"><div class="stat-box"><div class="stat-label">Подъем</div><div class="stat-val">${summary.wakeTime}</div></div><div class="stat-box"><div class="stat-label">Выход</div><div class="stat-val">${summary.firstLeave}</div></div></div></div>`;
        } else { summaryContainer.innerHTML = ''; }
      }

      const timeline = document.getElementById('timeline');
      if (!timeline) return;

      const combined = [...baseList, ...autoBlocks].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
      if (combined.length === 0) {
        timeline.innerHTML = `<div class="empty-state">Свободный день. Добавь тренировку, саморазвитие, прогулку или отдых.</div>`;
        updateLiveRadar(); return;
      }

      timeline.innerHTML = combined.map((item, idx) => {
        const t = TYPE_LABELS[item.type] || TYPE_LABELS.code;
        const dur = formatDuration(item.start, item.end);
        const isLive = isTodaySelected && (nowMins >= toMins(item.start) && nowMins < toMins(item.end));
        const delay = idx * 0.035;

        if (item.isAuto) {
          return `<div class="item-card auto-card ${isLive ? 'live-now' : ''}" style="--item-color:${t.hex}; animation-delay:${delay}s" onclick="openSettings()"><div class="time-col"><span class="time-start">${item.start}</span><span class="time-end">${item.end}</span>${dur ? `<span class="dur-tag">${dur}</span>` : ''}</div><div><div class="badge-row"><span class="badge" style="color:${t.hex}">${t.text}</span>${isLive ? `<span class="live-pill">СЕЙЧАС</span>` : ''}</div><div class="title">${item.title}</div><div class="meta"><span class="pill">${item.loc}</span></div></div><div class="actions"><button class="icon-btn">⚙️</button></div></div>`;
        }

        return `<div class="item-card ${item.done ? 'done' : ''} ${isLive ? 'live-now' : ''}" style="--item-color:${t.hex}; animation-delay:${delay}s"><div class="time-col" onclick="editItem('${item.id}')"><span class="time-start">${item.start}</span><span class="time-end">${item.end}</span>${dur ? `<span class="dur-tag">${dur}</span>` : ''}</div><div onclick="editItem('${item.id}')"><div class="badge-row"><span class="badge" style="color:${t.hex}">${t.text}</span>${isLive ? `<span class="live-pill">СЕЙЧАС</span>` : ''}</div><div class="title">${item.title}</div><div class="meta">${item.loc ? `<span class="pill">${item.loc}</span>` : ''}${item.note ? `<span>${item.note}</span>` : ''}</div></div><div class="actions"><button class="icon-btn check ${item.done ? 'checked' : ''}" onclick="toggleDone('${item.id}', this, event)">✓</button><button class="icon-btn del" onclick="deleteItem('${item.id}', event)">✕</button></div></div>`;
      }).join('');

      updateLiveRadar();
    } catch (err) { console.error('Ошибка рендера:', err); }
  }

  function selectDay(d) { currentDay = d; renderAll(); }

  function toggleDone(id, btn, event) {
    if (event) event.stopPropagation();
    const list = state[currentWeekParity][currentDay] || [];
    const item = list.find(x => x.id === id);
    if (!item) return;

    item.done = !item.done;

    if (['gym', 'code', 'hw'].includes(item.type)) {
      settings.tokens = (settings.tokens || 0) + (item.done ? 3 : -3);
      if (settings.tokens < 0) settings.tokens = 0;
      if (item.done && btn) {
        const floater = document.createElement('div');
        floater.innerText = '+3 ⚡'; floater.className = 'floating-token';
        btn.parentElement.appendChild(floater); setTimeout(() => floater.remove(), 950);
      }
    }
    saveAllStorage();

    if (btn) {
      const card = btn.closest('.item-card');
      if (card) {
        if (item.done) { card.classList.add('done'); btn.classList.add('checked'); }
        else { card.classList.remove('done'); btn.classList.remove('checked'); }
      }
    }
    updateTokensUI(); updateLiveRadar();
  }

  function deleteItem(id, event) {
    if (event) event.stopPropagation();
    const list = state[currentWeekParity][currentDay] || [];
    const idx = list.findIndex(x => x.id === id);
    if (idx > -1) {
      const item = list[idx];
      if (item.type === 'rest') settings.tokens = (settings.tokens || 0) + 3;
      if (item.done && ['gym', 'code', 'hw'].includes(item.type)) settings.tokens = Math.max(0, (settings.tokens || 0) - 3);
      list.splice(idx, 1); saveAllStorage(); renderAll();
    }
  }

  function setDuration(mins) {
    const startVal = document.getElementById('inp-start').value || '10:00';
    document.getElementById('inp-end').value = fromMins(toMins(startVal) + mins);
  }
  function shiftBlock(mins) {
    const s = document.getElementById('inp-start').value || '10:00'; const e = document.getElementById('inp-end').value || '11:30';
    document.getElementById('inp-start').value = fromMins(toMins(s) + mins); document.getElementById('inp-end').value = fromMins(toMins(e) + mins);
  }

  function duplicateToOtherWeek() {
    if (!editingId) return;
    const item = (state[currentWeekParity][currentDay] || []).find(x => x.id === editingId);
    if (!item) return;
    if (item.type === 'rest') { if ((settings.tokens || 0) < 3) { alert('⚡ Недостаточно токенов (нужно 3 ⚡)!'); return; } settings.tokens -= 3; }
    const targetWeek = currentWeekParity === 'even' ? 'odd' : 'even';
    state[targetWeek][currentDay].push(Object.assign({}, item, { id: 'id_' + Date.now(), done: false }));
    saveAllStorage(); closeModal(); renderAll(); alert(`Скопировано на ${targetWeek === 'even' ? 'четную' : 'нечетную'} неделю!`);
  }

  function editItem(id) {
    const item = (state[currentWeekParity][currentDay] || []).find(x => x.id === id);
    if (item) openModal(item);
  }

  function openModal(item = null) {
    editingId = item ? item.id : null;
    document.getElementById('modal-title').innerText = item ? 'Редактировать блок' : 'Новый блок';
    document.getElementById('dup-week-btn').style.display = item ? 'block' : 'none';
    document.getElementById('inp-title').value = item ? item.title : '';
    document.getElementById('inp-start').value = item ? item.start : '10:00'; document.getElementById('inp-end').value = item ? item.end : '12:30';
    document.getElementById('inp-type').value = item ? item.type : 'gym'; document.getElementById('inp-loc').value = item ? item.loc : 'Спортзал';
    document.getElementById('inp-note').value = item ? (item.note || '') : '';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function fillTemplate(t, ty, l, n = '') {
    document.getElementById('inp-title').value = t; document.getElementById('inp-type').value = ty;
    document.getElementById('inp-loc').value = l; document.getElementById('inp-note').value = n;
  }

  function saveItem() {
    const title = document.getElementById('inp-title').value.trim(); if (!title) return;
    const newType = document.getElementById('inp-type').value;
    const list = state[currentWeekParity][currentDay] || [];
    const oldItem = editingId ? list.find(x => x.id === editingId) : null;
    const wasRest = oldItem && oldItem.type === 'rest'; const isRest = newType === 'rest';

    if (isRest && !wasRest) {
      if ((settings.tokens || 0) < 3) { alert('⚡ Недостаточно токенов для отдыха (нужно 3 ⚡)! Выполни лабы, чтобы заработать.'); return; }
      settings.tokens -= 3;
    }
    if (!isRest && wasRest) settings.tokens = (settings.tokens || 0) + 3;

    const newItem = {
      id: editingId || 'id_' + Date.now(), title, start: document.getElementById('inp-start').value,
      end: document.getElementById('inp-end').value, type: newType, loc: document.getElementById('inp-loc').value.trim(),
      note: document.getElementById('inp-note').value.trim(), done: oldItem ? oldItem.done : false
    };

    if (editingId) {
      const idx = list.findIndex(x => x.id === editingId);
      if (idx > -1) list[idx] = newItem;
    } else { list.push(newItem); }
    saveAllStorage(); closeModal(); renderAll();
  }

  function openDeadlines() { renderDeadlinesList(); document.getElementById('deadlines-modal').classList.add('open'); }
  function closeDeadlines() { document.getElementById('deadlines-modal').classList.remove('open'); }
  function addDeadline() {
    const text = document.getElementById('dl-text').value.trim(), subj = document.getElementById('dl-subj').value;
    if (!text) return; deadlines.unshift({ id: 'dl_' + Date.now(), subj, text, done: false });
    document.getElementById('dl-text').value = ''; saveAllStorage(); renderDeadlinesList(); renderDeadlinesBadge();
  }
  function toggleDeadline(id) { const dl = deadlines.find(x => x.id === id); if (dl) { dl.done = !dl.done; saveAllStorage(); renderDeadlinesList(); renderDeadlinesBadge(); } }
  function removeDeadline(id) { deadlines = deadlines.filter(x => x.id !== id); saveAllStorage(); renderDeadlinesList(); renderDeadlinesBadge(); }
  function renderDeadlinesList() {
    const box = document.getElementById('todo-list'); if (!box) return;
    if (deadlines.length === 0) { box.innerHTML = `<div style="text-align:center;color:var(--subtext);padding:18px;font-size:13px;">Хвостов нет!</div>`; return; }
    box.innerHTML = deadlines.map(d => `<div class="todo-item ${d.done ? 'done' : ''}"><div class="todo-text" onclick="toggleDeadline('${d.id}')"><span class="todo-subj">${d.subj}</span>${d.text}</div><button class="icon-btn check ${d.done ? 'checked' : ''}" onclick="toggleDeadline('${d.id}')">✓</button><button class="icon-btn del" onclick="removeDeadline('${d.id}')">✕</button></div>`).join('');
  }

  function openSettings() {
    document.getElementById('set-theme').value = settings.theme || 'oled'; document.getElementById('set-home').value = settings.homeAddress || 'Дом';
    document.getElementById('set-bm').value = settings.timeBM || 90; document.getElementById('set-gast').value = settings.timeGastLen || 120;
    document.getElementById('set-prep').value = settings.prepTime || 50; document.getElementById('set-transit').value = settings.transitBMLen || 45;
    document.getElementById('set-gym-prep').value = settings.gymPrep || 20; document.getElementById('set-gym-walk').value = settings.gymWalk || 15;
    document.getElementById('settings-modal').classList.add('open');
  }

  function saveSettings() {
    settings.theme = document.getElementById('set-theme').value; settings.homeAddress = document.getElementById('set-home').value.trim() || 'Дом';
    settings.timeBM = Number(document.getElementById('set-bm').value) || 90; settings.timeGastLen = Number(document.getElementById('set-gast').value) || 120;
    settings.prepTime = Number(document.getElementById('set-prep').value) || 50; settings.transitBMLen = Number(document.getElementById('set-transit').value) || 45;
    settings.gymPrep = Number(document.getElementById('set-gym-prep').value) || 20; settings.gymWalk = Number(document.getElementById('set-gym-walk').value) || 15;
    saveAllStorage(); applyTheme(); document.getElementById('settings-modal').classList.remove('open'); renderAll();
  }

  function resetSchedule() {
    if (confirm('Сбросить до исходного расписания 1647?')) { state = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveAllStorage(); document.getElementById('settings-modal').classList.remove('open'); renderAll(); }
  }

  function exportICS() {
    let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//1647 OS//RU\n"; const datesArr = generateWeekDays(weekOffset);
    for (let i = 0; i < 7; i++) {
      const dayItems = state[currentWeekParity][i] || [];
      const d = datesArr[i].raw; const dateStr = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
      dayItems.forEach(item => {
        ics += "BEGIN:VEVENT\nSUMMARY:" + item.title + "\n"; if (item.loc) ics += "LOCATION:" + item.loc + "\n";
        ics += "DTSTART:" + dateStr + "T" + item.start.replace(':', '') + "00\nDTEND:" + dateStr + "T" + item.end.replace(':', '') + "00\nEND:VEVENT\n";
      });
    }
    ics += "END:VCALENDAR";
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' })); a.download = `Schedule_1647.ics`; a.click();
  }

  function exportBackup() {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ state, settings, deadlines })], { type: 'application/json' }));
    a.download = `1647_backup_${new Date().toLocaleDateString('ru-RU')}.json`; a.click();
  }

  function importBackup(e) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const imp = JSON.parse(ev.target.result);
        if (imp.state && imp.settings) {
          state = imp.state; settings = Object.assign({}, DEFAULT_SETTINGS, imp.settings); if (imp.deadlines) deadlines = imp.deadlines;
          saveAllStorage(); applyTheme(); renderAll(); document.getElementById('settings-modal').classList.remove('open'); alert('Успешно восстановлено!');
        }
      } catch (err) { alert('Ошибка файла!'); }
      e.target.value = '';
    };
    r.readAsText(f);
  }

  applyTheme();
  renderAll();
  fetchWeather();
  setInterval(updateLiveRadar, 5000);
</script>
</body>
</html>
